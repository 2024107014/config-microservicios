server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ms_producto
    username: postgres
    password: "${PRODUCTO_DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
